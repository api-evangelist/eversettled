aid: eversettled
name: Eversettled
description: EverSettled is a digital estate-settlement platform that guides families through
  the probate process after a death. Positioned between expensive probate attorneys and
  overwhelming do-it-yourself paperwork, it combines an adaptive, state-specific estate
  checklist, automated asset discovery across bank accounts, insurance policies and
  subscriptions, subscription cancellation and debt negotiation, secure document
  organization, a dedicated human estate-care specialist, and Sage, a 24/7 AI probate
  assistant. Available across all 50 U.S. states, EverSettled is not a law firm and does
  not provide legal services. Backed by a $5M seed round led by Emergence Capital with
  participation from Seedcamp.
